name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: python -m benchmark.generate_seed_set --check
      - run: node --check web/app.js
      - run: node --check web/summary.js
      - run: node tests/test_web_summary.js
      - run: python -m json.tool web/replay.schema.json > /dev/null
      - run: python -m json.tool web/replay.example.json > /dev/null
      - run: git diff --check
